<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Ecommerce</title>

    
<!-- Bootstrap 5.3.3 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS personalizado da NEXUS GAMING -->
<link rel="stylesheet" href="assets/css/styles.css">

</head>




<body>



    <header class="cabecalho-gamer">
        <div class="logo-gamer">
            <h1>⚡ NEXUS GAMING</h1>
            <p>Seu universo gamer começa aqui</p>
        </div>

        <nav class="menu-gamer">
            <a href="index.html">Início</a>
            <a href="#produtos">Produtos</a>
            <a href="#sobre">Sobre nós</a>
        </nav>
    </header>


    <main>
        
<!-- SEÇÃO DE PRODUTOS EM DESTAQUE -->
<section id="destaques" class="secao-destaques">

    <h2>🔥 Produtos em Destaque</h2>

    <div id="carouselDestaques"
         class="carousel slide">

        <div class="carousel-inner" id="lista-destaques">
            <!-- Os produtos serão inseridos pelo JavaScript -->
        </div>

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselDestaques"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"
                  aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#carouselDestaques"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"
                  aria-hidden="true"></span>
            <span class="visually-hidden">Próximo</span>
        </button>

    </div>

</section>


        <!-- Área de busca e filtros -->
        <section class="controles">

            <input type="text" id="search" placeholder="Buscar produto...">

            <select id="category">
                <option value="Todas">Todas</option>
            </select>

            <button id="btnRender">
                Renderizar
            </button>

        </section>

        <!-- Local onde os produtos serão mostrados -->
        <section>
            <h2>Produtos</h2>

            <div id="product-list"></div>
        </section>

        <!-- Local onde aparecerão os detalhes do produto -->
        <section class="detalhes">
            <h2>Detalhes do produto</h2>

            <div id="product-details">
                <p>Clique em "Ver detalhes" para visualizar um produto.</p>
            </div>
        </section>

    </main>

    
<!-- JavaScript do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript do nosso Ecommerce -->
<script src="assets/js/script.js"></script>
</body>

</html>
